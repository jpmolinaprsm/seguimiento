<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento y Optimización</title>
<style>
:root{
  --bg:#fafafa; --panel:#ffffff; --line:#ebebeb; --line2:#f3f3f3;
  --tx:#141414; --tx2:#5f6368; --tx3:#9aa0a6;
  --accent:#141414; --hover:#f5f5f5;
  --verde:#1f9d55; --amarillo:#e3a008; --naranja:#f07b1d; --rojo:#d93025; --gris:#d5d7da;
  --auto:#1a73e8; --banda:#eef1f4;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
textarea{font:inherit}
.top{position:sticky;top:0;z-index:5;background:rgba(250,250,250,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.marca{font-weight:600;font-size:13px;color:var(--tx2)}
.miga{font-size:13px;color:var(--tx3)} .miga a{color:var(--tx2)} .miga a:hover{color:var(--tx)} .miga b{color:var(--tx);font-weight:600}
.der{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:6px;color:var(--tx2);font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.fecha{font-size:12px;color:var(--tx3)}
.tlink{font-size:13px;color:var(--tx2);border:0;background:transparent;padding:4px 6px}
.tlink:hover{color:var(--tx)}
.tlink b{background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;font-weight:600;margin-left:4px}
main{max-width:1180px;margin:0 auto;padding:32px 24px 80px}
h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0}
h2{font-size:13px;font-weight:600;margin:0;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
h3{font-size:15px;margin:0 0 6px;font-weight:600}
.sub{color:var(--tx2);margin:4px 0 0}
.cab{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.cab .der{align-self:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 28px;align-items:center}
.tabs a{padding:8px 12px;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.tabs a:hover{color:var(--tx)}
.tabs a.on{color:var(--tx);border-color:var(--accent);font-weight:500}
.tabs .fin{margin-left:auto}
.btn-acc{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px}
.btn-acc:hover{background:var(--hover)}
.btn-acc b{background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:600}
.bloque{margin:0 0 40px}
.bloque>.bh{display:flex;align-items:baseline;gap:12px;margin:0 0 6px;flex-wrap:wrap}
.bloque>.bh .nota{font-size:12px;color:var(--tx3)}
.ayuda{font-size:13px;color:var(--tx2);margin:0 0 12px;max-width:860px}
details.como{margin:-6px 0 12px;font-size:12px;color:var(--tx2)}
details.como summary{cursor:pointer;color:var(--tx3);list-style:none}
details.como summary::before{content:"ⓘ ";}
details.como[open] summary{color:var(--tx2)}
details.como div{margin-top:6px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:860px}
.caja{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.vacio{padding:28px;text-align:center;color:var(--tx3);font-size:13px}
.muted{color:var(--tx3)} .small{font-size:12px} .tx2{color:var(--tx2)}
/* semáforos */
.luces{display:inline-flex;gap:10px;align-items:center;white-space:nowrap;flex-wrap:wrap}
.luz{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2)}
.luz i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--gris);flex:none}
.luz i.verde{background:var(--verde)} .luz i.amarillo{background:var(--amarillo)} .luz i.naranja{background:var(--naranja)} .luz i.rojo{background:var(--rojo)}
.luz i.vacia{background:transparent;border:1.5px solid var(--gris)}
.luz.solo span{display:none}
.efi{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);white-space:nowrap}
.efi i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none;background:var(--gris)}
.efi i.verde{background:var(--verde)} .efi i.amarillo{background:var(--amarillo)} .efi i.naranja{background:var(--naranja)} .efi i.rojo{background:var(--rojo)}
.delta{font-size:11px;white-space:nowrap} .delta.bien{color:var(--verde)} .delta.mal{color:var(--rojo)} .delta.neutro{color:var(--tx3)}
/* portada */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:#d6d6d6;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.card .fila{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--line2);font-size:13px;gap:8px}
.card .fila:first-of-type{border-top:0}
.card .fila span{color:var(--tx2)}
.card .fila b{font-weight:600;text-align:right}
.card .rend{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(7,1fr)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:16px;border-left:1px solid var(--line2)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:12px;color:var(--tx2)}
.kpi .v{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:4px 0 6px;white-space:nowrap}
.kpi .d{font-size:12px;color:var(--tx3);margin-top:6px}
.kpi.principal{background:#fcfcfc}
.kpi.principal .k{color:var(--tx);font-weight:600}
.kpi .l2{display:flex;flex-direction:column;gap:3px}
.kpi .tag{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.sec2{display:flex;flex-wrap:wrap;border-top:1px solid var(--line2)}
.sec2 .m{padding:12px 16px;border-left:1px solid var(--line2);min-width:140px;flex:1}
.sec2 .m:first-child{border-left:0}
.sec2 .m .k{font-size:11px;color:var(--tx3)}
.sec2 .m .v{font-weight:600;margin-top:2px;display:flex;align-items:center;gap:8px}
.sim{font-size:11px;color:var(--tx3);border:1px dashed var(--gris);border-radius:6px;padding:0 5px;white-space:nowrap}
.video{display:grid;grid-template-columns:repeat(3,1fr) 2fr;border-top:1px solid var(--line2)}
.video .m{padding:12px 16px;border-left:1px solid var(--line2)}
.video .m:first-child{border-left:0}
.video .m .k{font-size:11px;color:var(--tx3)}
.video .m .v{font-weight:600;margin-top:2px;display:flex;align-items:center;gap:8px}
.curva{display:flex;align-items:flex-end;gap:10px;height:54px;margin-top:6px}
.curva .c{flex:1;position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.curva .c i{display:block;width:100%;background:#cfd4da;border-radius:3px 3px 0 0}
.curva .c s{position:absolute;left:-2px;right:-2px;height:2px;background:var(--tx)}
.curva .c span{font-size:10px;color:var(--tx3);position:absolute;bottom:-16px}
/* listas */
.lista>.it{display:grid;align-items:center;gap:16px;padding:14px 18px;border-top:1px solid var(--line2)}
.lista>.it:first-child{border-top:0}
.lista>.it.click{cursor:pointer} .lista>.it.click:hover{background:var(--hover)}
.nom{font-weight:500} .meta{font-size:12px;color:var(--tx3);margin-top:2px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.th{display:grid;gap:16px;padding:0 18px 8px;font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.estado{font-size:12px;color:var(--tx2);white-space:nowrap}
.estado.por{color:var(--amarillo)} .estado.sin{color:var(--rojo)}
.chip{display:inline-block;font-size:12px;color:var(--tx2);border:1px solid var(--line);border-radius:12px;padding:1px 8px;margin:2px 4px 2px 0;white-space:nowrap}
.chip.auto{color:var(--auto);border-color:#cfe0fb}
.chip.rojo{color:var(--rojo);border-color:#f5c6c2} .chip.amarillo{color:#a36f00;border-color:#f3dca0}
.senal{font-weight:500} .senal.v{color:var(--verde)} .senal.a{color:var(--amarillo)}
.filtros{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;align-items:center}
.fb{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 12px;font-size:12px;color:var(--tx2)}
.fb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.post{font-size:12px;color:var(--auto);border:0;background:transparent;padding:0}
.post:hover{text-decoration:underline}
/* gasto */
.consumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:16px}
.cons{padding:20px}
.cons .cifras{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}
.cons .cifras div span{display:block;font-size:12px;color:var(--tx2)}
.cons .cifras div b{font-size:28px;font-weight:600;letter-spacing:-.02em}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:12px;padding:2px 10px}
.badge.verde{background:#e5f5ea;color:var(--verde)} .badge.amarillo{background:#fdf3e1;color:#a36f00} .badge.rojo{background:#fde4e4;color:var(--rojo)}
.mini{height:4px;border-radius:2px;background:var(--line2);position:relative;margin-top:6px;min-width:80px}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--tx2)}
.peso{height:6px;border-radius:3px;background:var(--line2);position:relative;min-width:60px}
.peso i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#b9bfc6}
.leyline{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:8px}
.leyline span{display:inline-flex;align-items:center;gap:6px}
.leyline i{width:14px;height:3px;border-radius:2px;display:inline-block}
/* acciones */
.acc{padding:18px 20px;border-top:1px solid var(--line2)}
.acc:first-child{border-top:0}
.acc .tipo{font-size:12px;color:var(--tx3);margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acc .tit{font-weight:600;font-size:15px;letter-spacing:-.01em}
.acc .que{color:var(--tx2);margin:4px 0 10px}
.acc .hacer{display:flex;gap:8px;align-items:baseline}
.acc .hacer b{font-weight:600}
.acc .porque{font-size:12px;color:var(--tx3);margin-top:8px;padding-left:12px;border-left:2px solid var(--line)}
.acc .porque em{font-style:normal;color:var(--tx2);font-weight:500}
.acc .piezas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.b{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--tx)}
.b:hover{background:var(--hover)}
.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.b.pri:hover{background:#333}
.b[disabled]{opacity:.35;cursor:not-allowed}
.b.link{border:0;background:transparent;color:var(--tx2);padding:6px 4px}
.b.link:hover{color:var(--tx);background:transparent}
.b.sm{padding:3px 10px;font-size:12px}
.b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.desc{display:inline-flex;gap:6px;align-items:center}
.desc select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;background:var(--panel);color:var(--tx)}
.opinion{margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fcfcfc}
.opinion .fila{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.opinion textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;min-height:54px;resize:vertical;background:#fff}
.hecha{display:flex;gap:10px;align-items:center;padding:10px 20px;border-top:1px solid var(--line2);font-size:13px;color:var(--tx2)}
.hecha:first-child{border-top:0}
.hecha .que{flex:1}
/* insights */
.ins{padding:18px 20px;border-top:1px solid var(--line2)}
.ins:first-child{border-top:0}
.ins .t{font-weight:600;letter-spacing:-.01em}
.ins .x{color:var(--tx2);margin-top:4px;font-size:13px}
.ins .f{font-size:12px;color:var(--tx3);margin-top:6px}
.ins .signo{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
.cruce{display:grid;grid-template-columns:1fr 1fr 16px;gap:24px;padding:16px 20px;border-top:1px solid var(--line2);align-items:start}
.cruce:first-child{border-top:0}
.cruce .lab{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.cruce .ahora{font-weight:500}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.dos,.tres{grid-template-columns:1fr}.cruce{grid-template-columns:1fr}.video{grid-template-columns:1fr 1fr}.consumo{grid-template-columns:1fr}}
/* piezas */
.pieza{padding:14px;display:flex;flex-direction:column;gap:10px}
.pieza iframe{width:100%;border:0;border-radius:8px;background:var(--line2)}
.pieza .datos{font-size:12px;color:var(--tx2);display:flex;gap:10px;flex-wrap:wrap}
/* campaña */
.subtabs{display:flex;gap:6px;margin:0 0 14px}
.spark{display:block}
.leyenda{display:flex;gap:14px;font-size:12px;color:var(--tx3);align-items:center;flex-wrap:wrap}
.hist{padding:20px}
.hist .txt{display:flex;gap:32px;flex-wrap:wrap;margin-bottom:14px;font-size:13px}
.hist .txt div span{display:block;font-size:12px;color:var(--tx3)}
.hist .txt div b{font-weight:600}
/* modal */
.velo{position:fixed;inset:0;background:rgba(20,20,20,.35);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--panel);border-radius:14px;max-width:820px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal .mh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.modal .mh .x{margin-left:auto}
.modal textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.embeds{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.embeds iframe{width:100%;border:0;border-radius:8px;background:var(--line2)}
/* guía */
.guia h3{margin-top:22px}
.guia p,.guia li{color:var(--tx2);max-width:820px}
.guia dl{display:grid;grid-template-columns:220px 1fr;gap:8px 20px;max-width:900px}
.guia dt{font-weight:600} .guia dd{margin:0;color:var(--tx2)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <span class="marca">Seguimiento y Optimización</span>
  <span class="miga" id="miga"></span>
  <div class="der">
    <div class="seg" id="canal"><button data-c="Oficial">Oficial</button><button data-c="Informativo">Informativo</button></div>
    <a class="tlink" href="#guia">Cómo leer</a>
    <button class="tlink" onclick="comentarPantalla()">Comentar esta pantalla</button>
    <button class="tlink" id="exportar" onclick="exportarComentarios()">Exportar comentarios</button>
    <span class="fecha" id="fecha"></span>
  </div>
</div></header>
<main id="app"></main>
<div id="capa"></div>

<script>
const D = /*__DATA__*/null;

// ---------- utilidades ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = (x) => encodeURIComponent(x).replace(/'/g, '%27');
const go = (r) => { location.hash = r; };
const M = (n) => { n = n || 0; const a = Math.abs(n); return a >= 1e6 ? '$' + (a / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' M' : a >= 1e3 ? '$' + Math.round(a / 1e3).toLocaleString('es-AR') + ' k' : '$' + Math.round(a); };
const N = (n) => { n = n || 0; return n >= 1e6 ? (n / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' M' : n >= 1e4 ? Math.round(n / 1e3).toLocaleString('es-AR') + ' k' : Math.round(n).toLocaleString('es-AR'); };
const $$ = (n) => n == null || !isFinite(n) ? '—' : n < 100 ? '$' + n.toLocaleString('es-AR', { maximumFractionDigits: 2 }) : '$' + Math.round(n).toLocaleString('es-AR');
const pct = (x, d = 2) => x == null || !isFinite(x) ? '—' : x.toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' %';
const veces = (x) => x == null || !isFinite(x) ? '—' : x.toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '×';
const dm = (f) => f ? f.slice(8, 10) + '/' + f.slice(5, 7) : '—';
const dmy = (f) => f ? f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(2, 4) : '—';
const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const dias = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const MESES = { '01': 'enero', '02': 'febrero', '03': 'marzo', '04': 'abril', '05': 'mayo', '06': 'junio', '07': 'julio', '08': 'agosto', '09': 'septiembre', '10': 'octubre', '11': 'noviembre', '12': 'diciembre' };
const mesTxt = (m) => MESES[m.slice(5, 7)];
const leer = (k, def) => { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(def)); } catch (e) { return def; } };
const grabar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
function ayuda(texto, como) {
  return `<p class="ayuda">${texto}</p>${como ? `<details class="como"><summary>Cómo se calcula</summary><div>${como}</div></details>` : ''}`;
}

let CANAL = leer('seg-canal', 'Oficial');
function setCanal(c) { CANAL = c; grabar('seg-canal', c); render(); }

// ---------- métricas y semáforos ----------
// o = sumas { g, i, r, c, e, co, sh, vi, vw, v25..v100 } + esperado con la mediana de la referencia: x* (general) y p* (proyecto)
// ±20 % contra la referencia (igual que el tablero de Dirección): rojo = 20 % o más peor, verde = 20 % o más mejor
const UMB_TASA = [1 / 1.2, 1.2], UMB_CPM = [1 / 1.2, 1.2];
const color = (ix, u = UMB_TASA) => ix == null || !isFinite(ix) ? 'gris' : ix < u[0] ? 'rojo' : ix < u[1] ? 'amarillo' : 'verde';
function kp(o) {
  const i = o.i || 0;
  const div = (a, b) => (a != null && b ? a / b : null);
  const ix = (p) => {
    const precio = div(o[p + 'g'], o.g); // >1 = más barato que la referencia
    const reac = div(o.r, o[p + 'r']), comp = div(o.sh, o[p + 'sh']), clk = div(o.c, o[p + 'c']);
    return { cpm: precio, r: reac, sh: comp, co: div(o.co, o[p + 'co']), e: div(o.e, o[p + 'e']), c: clk,
      cr: reac != null && precio != null && o.r ? reac * precio : null, cpc: clk != null && precio != null && o.c ? clk * precio : null,
      csh: comp != null && precio != null && o.sh ? comp * precio : null,
      vw: div(o.vw, o[p + 'vw']), r25: div(o.v25, o[p + '25']), r100: div(o.v100, o[p + '100']) };
  };
  return { g: o.g, i, r: o.r, e: o.e, c: o.c, sh: o.sh, co: o.co, alc: i / (1.6 + (hash(o.g) % 18) / 10),

  const gen = `<div class="caja">${D.generales.map((g) => `<div class="ins"><div class="t">${esc(g.titulo)}</div><div class="x">${esc(g.texto)}</div><div class="f">${esc(g.fuente)}</div></div>`).join('')}</div>`;

function tarjetaAccion(a, p, conCamp = true) {

  const voto = (v) => `<button class="b sm ${o.voto === v ? 'on' : ''}" onclick="opinar('${a.id}','voto','${v}')">${v}</button>`;
  const piezas = (a.piezas || []).filter((x) => x && (x.fb || x.ig || x.otro));
  return `<div class="acc"><div class="tipo">${esc(a.tipo)}${conCamp && a.camp ? ` · <a class="tx2" href="#p/${p.id}/c/${enc(a.camp)}">ver campaña</a>` : ''}${pau ? ' · <span class="chip auto">se puede hacer desde PAUTADOR</span>' : ''}</div>
    <div class="tit">${esc(a.titulo)}</div><div class="que">${esc(a.que)}</div>
    <div class="hacer"><span class="tx2">→</span><b>${esc(a.hacer)}</b></div>
    ${piezas.length ? `<div class="piezas">${piezas.map((x) => botonPieza(x, `ver pieza: ${esc((x.rol ? x.rol + ' — ' : '') + (x.nombre.length > 40 ? x.nombre.slice(0, 38) + '…' : x.nombre))}`)).join('')}</div>` : ''}

// ---------- CAMPAÑA ----------
function historiaPropia(c) {
  const pr = c.propia, prop = propiaDe(c);
  if (!pr) return '';
  const ws = pr.semanas.filter((w) => w.x != null);
  const W = 720, H = 150, max = Math.max(1.2, ...ws.map((w) => w.x), pr.ref ? pr.ref.p75 * 1.2 : 0), bw = W / Math.max(1, ws.length);
  const y = (v) => H - 20 - v / max * (H - 30);
  const banda = pr.ref ? `<rect x="0" y="${y(pr.ref.p75).toFixed(1)}" width="${W}" height="${(y(pr.ref.p25) - y(pr.ref.p75)).toFixed(1)}" fill="var(--banda)"/><line x1="0" x2="${W}" y1="${y(pr.ref.p50).toFixed(1)}" y2="${y(pr.ref.p50).toFixed(1)}" stroke="#b9c0c8" stroke-dasharray="4 4"/>` : '';
  const barras = ws.map((w, i) => `<rect x="${(i * bw + 2).toFixed(1)}" y="${y(w.x).toFixed(1)}" width="${Math.max(2, bw - 4).toFixed(1)}" height="${(H - 20 - y(w.x)).toFixed(1)}" rx="2" fill="${i >= ws.length - 2 ? '#141414' : '#c4c4c4'}"><title>Semana del ${dm(w.s)}: ${veces(w.x)} · ${M(w.g)}</title></rect>`).join('');
  const labs = ws.map((w, i) => i % Math.ceil(ws.length / 8) === 0 ? `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${H - 4}" font-size="10" text-anchor="middle" fill="#9aa0a6">${dm(w.s)}</text>` : '').join('');
  const lectura = prop.temporada
    ? `Contra la temporada que arrancó el <b>${dmy(pr.previa.desde)}</b>: en las mismas ${pr.previa.semanasComparadas} semanas rinde <b>${veces(pr.idxTemporada)}</b> (costos ajustados por inflación).`
    : pr.ref ? `Las últimas 2 semanas (en negro) rinden <b>${veces(pr.idxPropio)}</b> su mediana propia. La franja gris es su rango normal (cuartiles de ${pr.ref.semanas} semanas anteriores).` : 'Todavía tiene poca historia: la luz aparece desde la tercera semana.';
  const conf = pr.tipo === 'temporada' ? `<div style="display:flex;gap:6px;align-items:center;margin-top:12px"><span class="small tx2">¿Es estacional?</span><button class="b sm ${estacional(c.uid) === true ? 'on' : ''}" onclick="marcarEstacional(decodeURIComponent('${enc(c.uid)}'), true)">Sí</button><button class="b sm ${estacional(c.uid) === false ? 'on' : ''}" onclick="marcarEstacional(decodeURIComponent('${enc(c.uid)}'), false)">No</button></div>` : '';
  return `<section class="bloque"><div class="bh"><h2>${prop.temporada ? 'Contra la temporada anterior' : 'Contra su propia historia'}</h2><span class="nota">KPI principal por semana</span></div>
    ${ayuda('Las campañas largas se comparan contra sí mismas: así se ve si se están desgastando o si están en su mejor momento, más allá del promedio.', 'Cada barra es una semana completa: su KPI principal contra la referencia general (1,0× = la mediana de todos los gobiernos), así un cambio de formato no se confunde con un desgaste. La franja gris va del 25 % peor al 25 % mejor de sus semanas anteriores; la línea punteada es su mediana. Tendencia = últimas 4 semanas contra las 8 anteriores. Presión = impresiones de la campaña por habitante.')}
    <div class="caja hist"><div class="txt">
      <div><span>Luz ${esc(prop.lab)}</span><b>${puntos([prop.color])} ${veces(prop.ix)}</b></div>
      <div><span>Al aire</span><b>${Math.round(pr.span / 7)} semanas</b></div>
      ${pr.tendencia != null ? `<div><span>Tendencia (4 vs 8 semanas)</span><b>${veces(pr.tendencia)}</b></div>` : ''}
      ${pr.presion != null ? `<div><span>Presión del último mes</span><b>${pr.presion.toLocaleString('es-AR', { maximumFractionDigits: 1 })} imp./hab.</b></div>` : ''}
      ${pr.presionAcum != null ? `<div><span>Presión acumulada</span><b>${pr.presionAcum.toLocaleString('es-AR', { maximumFractionDigits: 0 })} imp./hab.</b></div>` : ''}</div>
      ${ws.length ? `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="max-height:${H}px">${banda}${barras}${labs}</svg>` : ''}
      <div class="small tx2" style="margin-top:10px">${lectura}</div>${conf}</div></section>`;
}

    }).join('')}</div>` : '<div class="caja vacio">Sin detalle de contenidos (campaña de hace más de 60 días).</div>');

        <div class="num">${M(x.g)}</div><div class="num">${px.val}</div><div>${puntos([color(px.G, px.u), color(px.P, px.u)])} <span class="small muted">${veces(px.G)} · ${veces(px.P)}</span> ${efiChip(x.efi, true)}</div></div>`;

function vistaGuia() {
  miga([['Mis proyectos', '#'], ['Cómo leer esta pantalla']]);
  return `<div class="guia"><h1>Cómo leer Seguimiento y Optimización</h1>
    <p class="sub">Qué muestra cada cosa, de dónde sale y cómo se calcula.</p>
    <h3>Las luces</h3>
    <dl><dt><span class="luz"><i class="verde"></i></span> General</dt><dd>Contra lo normal en todos los gobiernos (último año), para el mismo objetivo, formato y placement.</dd>
    <dt><span class="luz"><i class="verde"></i></span> Proyecto</dt><dd>Contra lo normal en este mismo proyecto y canal (último año).</dd>
    <dt><span class="luz"><i class="verde"></i></span> Propia</dt><dd>Solo campañas de 30+ días: contra sus propias semanas anteriores. Si la campaña es estacional y el equipo lo confirma, contra la temporada anterior.</dd>
    <dt>Colores</dt><dd>Verde: 20 % o más mejor que la referencia. Amarillo: dentro de ±20 %. Rojo: 20 % o más peor. Los números (1,3×) dicen cuántas veces lo normal; en costos, más de 1 significa más barato.</dd>
    <dt><span class="efi"><i class="naranja"></i></span> Eficacia</dt><dd>La regla de Looker: cada anuncio (en cada placement) se compara con los de su mismo objetivo y placement del proyecto en su misma época; rojo si está entre el 25 % más caro por reacción. Se resume como % del gasto en anuncios rojos: menos de 25 % verde, 50 % amarillo, 75 % naranja, más rojo.</dd></dl>
    <h3>KPI principal según objetivo</h3>
    <dl><dt>Alcance</dt><dd>CPM (costo cada mil impresiones) e impresiones.</dd><dt>Interacción</dt><dd>Costo por reacción.</dd><dt>Tráfico</dt><dd>CTR (clicks ÷ impresiones).</dd><dt>Reproducciones</dt><dd>Costo por reproducción (en Costo por objetivo).</dd></dl>
    <p>Aprendido: el mismo contenido en Interacción paga 3,3× el CPM que en Alcance, pero cada reacción sale 7× más barata. Por eso cada campaña se juzga con la métrica de lo que compra.</p>
    <h3>Métricas</h3>
    <dl><dt>Costo por reacción</dt><dd>Gasto ÷ reacciones. La medida de efectividad de los contenidos.</dd>
    <dt>Tasa de reacción</dt><dd>Reacciones ÷ impresiones.</dd><dt>Tasa de compartido</dt><dd>Compartidas ÷ impresiones: difusión orgánica.</dd><dt>Tasa de comentario</dt><dd>Comentarios ÷ impresiones: conversación (o polémica).</dd>
    <dt>ETR</dt><dd>Engagement ÷ impresiones. En video casi todo el engagement son reproducciones; en placas, clicks: se compara dentro del mismo formato.</dd><dt>CTR</dt><dd>Clicks ÷ impresiones.</dd>
    <dt>Tasa de reproducción</dt><dd>Reproducciones ÷ impresiones (video).</dd><dt>Retención 25 / 50 / 75 / 100 %</dt><dd>Reproducciones que llegan a ese punto ÷ reproducciones.</dd><dt>VTR</dt><dd>Reproducciones completas ÷ impresiones.</dd>
    <dt>Alcance</dt><dd>Personas únicas. Hoy simulado: llega cuando se conecte la API de Meta.</dd><dt>$ de más</dt><dd>Lo gastado por encima de lo que habría costado el mismo resultado al costo habitual del proyecto.</dd></dl>
    <h3>Bloques</h3>
    <dl><dt>Costo por objetivo</dt><dd>Red × objetivo, mes en curso contra los 3 meses anteriores; todas las plataformas.</dd>
    <dt>Gasto del mes</dt><dd>Inversión contra tiempo, con el PresupuestoMensual de DataJunta. Proyección = promedio de los últimos 2 días completos.</dd>
    <dt>Impacto comparado</dt><dd>El mes en curso contra los dos anteriores, día a día.</dd>
    <dt>Picos y apagones</dt><dd>Gasto diario de cada red o activo contra su día típico del mes anterior. Pico: más de 2×. Apagón: menos de 0,5×.</dd>
    <dt>Acciones</dt><dd>Qué pasa, qué hacer y por qué. Se envían a PAUTADOR (activos automatizados), se marcan como hechas a mano o se descartan con motivo. El agente aprende de esas decisiones y de las opiniones.</dd></dl>
    <h3>Datos</h3>
    <p>DataJunta (Meta: copia diaria de 180 días; todas las plataformas desde junio), tabla de eficacia (automatizado.eficacia_anuncios, se regenera todos los días), planilla de pedidos de presupuesto (en revisión). Se usa el último día completo: DataJunta carga a las 8:00 el día anterior. Las referencias salen del análisis del último año (analisis-datajunta, tandas 5 y 6).</p>
    <h3>Comentarios</h3>
    <p>En cada recomendación podés marcar si sirve y dejar un comentario; con “Comentar esta pantalla” opinás sobre la pantalla entera. “Exportar comentarios” descarga un archivo con todo para compartir.</p></div>`;
}

// ---------- router ----------
function render() {
  document.querySelectorAll('#canal button').forEach((x) => x.classList.toggle('on', x.dataset.c === CANAL));
  const partes = location.hash.slice(1).split('/');
  let html;
  if (partes[0] === 'guia') html = vistaGuia();
  else if (partes[0] === 'p' && proyecto(partes[1])) {
    const p = proyecto(partes[1]);
    const b = bloque(p);
    if (!b) { html = `<div class="caja vacio">${esc(p.nombre)} no tiene ${CANAL}. <a class="tx2" href="#">Volver a mis proyectos</a></div>`; miga([['Mis proyectos', '#'], [p.nombre]]); }
    else {
      miga([['Mis proyectos', '#'], [p.nombre]]);
      const tab = partes[2] || 'resumen';
      html = tab === 'c' ? vistaCampana(p, b, decodeURIComponent(partes.slice(3).join('/')))
        : tab === 'campanas' ? vistaCampanas(p, b) : tab === 'activos' ? vistaActivos(p, b) : tab === 'insights' ? vistaInsights(p, b)
          : tab === 'acciones' ? vistaAcciones(p, b) : vistaResumen(p, b);
    }
  } else html = vistaPortada();
  $('#app').innerHTML = html;
  $('#fecha').textContent = 'Datos al ' + dm(D.datosHasta);
  contarComentarios();
}
document.querySelectorAll('#canal button').forEach((x) => x.addEventListener('click', () => setCanal(x.dataset.c)));
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
